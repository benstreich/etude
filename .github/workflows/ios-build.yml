# Compiles the iOS app for the Simulator on a GitHub macOS runner. No Apple
# account or signing needed — this exists to catch Swift / native build errors
# in modules/*/ios and targets/widgets before spending an EAS build on them.
name: iOS build

on:
  workflow_dispatch:
  push:
    paths:
      - 'modules/**/ios/**'
      - 'targets/**'
      - 'plugins/**'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ios-build.yml'

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Generates ios/ (incl. the widget target via @bacons/apple-targets) and runs pod install
      - run: npx expo prebuild -p ios --clean
        env:
          CI: 1

      - name: xcodebuild (Release, Simulator, unsigned)
        run: |
          set -o pipefail
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build | xcbeautify

      # The .app installs on any Simulator — for screenshots and a first look
      - uses: actions/upload-artifact@v4
        with:
          name: etude-simulator-app
          path: build/Build/Products/Release-iphonesimulator/*.app
          retention-days: 14
