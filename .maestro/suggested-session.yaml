# "Suggested for today" (#95): with a week of practice on two focuses that
# then sat idle for a fortnight, the Practice picker suggests a session, Start
# runs it through the routine runner, and dismissing hides the card until
# tomorrow. The history is seeded through log-past onto seven days 15–21 days
# back (scripts/stale-days.js), one entry per focus per day.
appId: com.benstreich.etude
name: Suggested session
tags:
  - regression
---
- runFlow: common/fresh-start.yaml
- runScript: scripts/stale-days.js

- repeat:
    times: 7
    commands:
      - scrollUntilVisible:
          element:
            id: "log-past-open"
          direction: DOWN
      - tapOn:
          id: "log-past-open"
      - runFlow:
          when:
            true: ${output.days[output.i].prev == 'yes'}
          commands:
            - tapOn:
                id: "cal-prev"
      - tapOn:
          id: "cal-day-${output.days[output.i].key}"
      - tapOn: "Scales & arpeggios"
      - tapOn:
          id: "log-past-minutes"
      - inputText: "20"
      - hideKeyboard
      - tapOn:
          id: "log-past-add"
      # the same day again, for the second focus
      - scrollUntilVisible:
          element:
            id: "log-past-open"
          direction: DOWN
      - tapOn:
          id: "log-past-open"
      - runFlow:
          when:
            true: ${output.days[output.i].prev == 'yes'}
          commands:
            - tapOn:
                id: "cal-prev"
      - tapOn:
          id: "cal-day-${output.days[output.i].key}"
      - tapOn: "Sight reading"
      - tapOn:
          id: "log-past-minutes"
      - inputText: "20"
      - hideKeyboard
      - tapOn:
          id: "log-past-add"
      - evalScript: ${output.i = output.i + 1}

# the card is there, with a Start row
- tapOn: "Practice"
- scrollUntilVisible:
    element:
      id: "suggest-card"
    direction: DOWN
- tapOn:
    id: "suggest-start"

# the runner opens on the first suggested segment, a seeded technique
- assertVisible: "Segment 1 of 2"
- tapOn:
    id: "run-end"
# ending within the first 30 seconds leaves without logging — nothing to confirm
- tapOn: "Practice"

# dismiss hides the card
- scrollUntilVisible:
    element:
      id: "suggest-dismiss"
    direction: DOWN
- tapOn:
    id: "suggest-dismiss"
- assertNotVisible:
    id: "suggest-card"

# ...and it stays hidden across a restart
- launchApp
- tapOn: "Practice"
- assertNotVisible:
    id: "suggest-card"
