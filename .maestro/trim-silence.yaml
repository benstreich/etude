# Auto-trim silence (#88): a recorded take reaches the trim sheet with the
# "Trim silence" action wired to it, and saving from that sheet still round-trips
# through the store.
#
# What this flow can NOT assert: that the handles actually move. Detection needs
# audible sound in the take, and an emulator's virtual mic records silence — an
# all-silence take is exactly the case `detectSilence` returns null for, so the
# chip renders disabled and there is nothing to snap to. The maths is covered
# deterministically by `npm run check:silence`; what is only checkable here is
# the wiring: the take saves through the widened `addRecording`, the chip is in
# the sheet, and Save closes it without losing the take.
appId: com.benstreich.etude
name: Trim silence on a take
tags:
  - smoke
---
- runFlow: common/fresh-start.yaml

# a piece to file the take under — the same manual, offline creation path
# repertoire-piece.yaml uses (a name no iTunes search matches)
- tapOn: "Repertoire"
- tapOn:
    id: "repertoire-add"
- tapOn:
    id: "add-name-input"
- inputText: "Zzq Silence 447"
- hideKeyboard
- tapOn:
    id: "add-create"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: "add-confirm"
    retryTapIfNoChange: true
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: "add-confirm"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000

- scrollUntilVisible:
    element:
      text: "Zzq Silence 447"
    direction: DOWN
- tapOn: "Zzq Silence 447"

# record a short take: start, let the recorder accumulate level samples, stop
- scrollUntilVisible:
    element:
      id: "piece-record"
    direction: DOWN
- tapOn:
    id: "piece-record"
- waitForAnimationToEnd:
    timeout: 4000
- tapOn:
    id: "piece-record"
- waitForAnimationToEnd:
    timeout: 3000

# the take is in the list, so the widened addRecording still saves
- scrollUntilVisible:
    element:
      id: "recording-trim"
    direction: DOWN
- tapOn:
    id: "recording-trim"
- waitForAnimationToEnd:
    timeout: 3000

# the sheet carries the action. It is disabled on a silent take (see the header),
# so the tap is a no-op there — it must still not break the sheet.
- assertVisible:
    id: "trim-silence"
- tapOn:
    id: "trim-silence"
- tapOn:
    id: "trim-save"
- waitForAnimationToEnd:
    timeout: 3000

# saving closed the sheet and left the take where it was
- launchApp
- tapOn: "Repertoire"
- scrollUntilVisible:
    element:
      text: "Zzq Silence 447"
    direction: DOWN
- tapOn: "Zzq Silence 447"
- scrollUntilVisible:
    element:
      id: "recording-trim"
    direction: DOWN
- assertVisible:
    id: "recording-trim"
